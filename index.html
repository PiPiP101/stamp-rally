<style>
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------------- Customer (มือถือ) ---------------- */
.cust{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
.cust>*{flex-shrink:0}
.cust.embedded{min-height:100%;height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.cust.embedded::-webkit-scrollbar{display:none}
.c-head{position:relative;overflow:hidden;background:var(--primary);color:#fff;padding:18px 20px 64px}
.cust.embedded .c-head{padding-top:50px}
.c-head .logo{display:block;width:140px;height:auto}
.c-title{font-size:36px;line-height:1.05;font-weight:600;letter-spacing:-.01em;margin-top:20px}
.c-sub{margin-top:8px;font-size:14.5px;color:rgba(255,255,255,.88);max-width:28em}
.c-smile{position:absolute;right:-34px;top:-30px;width:150px;pointer-events:none}
.c-body{flex:1 0 auto;position:relative;z-index:2;margin-top:-42px;padding:0 12px 8px}
.sheet{background:var(--surface);border-radius:var(--plate);padding:22px 18px 24px;box-shadow:0 1px 0 var(--line),0 24px 48px -30px rgba(16,41,79,.5)}
.sheet h2{font-size:22px;font-weight:600;line-height:1.3}
.sheet .lead{color:var(--ink-2);font-size:15px;margin-top:6px}
.c-foot{padding:18px 20px 26px;text-align:center;color:var(--muted);font-size:12px}
.tel-form{margin-top:16px}
.tel-label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.tel-input{height:58px;font-size:24px;font-weight:600;letter-spacing:.06em;text-align:center}
.tel-err{margin-top:8px;color:var(--danger,#C0392B);font-size:14px}
.tel-note{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center}
.tel-chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:13.5px;padding:6px 12px;margin-bottom:10px}
.tel-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.tel-row b{color:var(--ink)}
.c-toasts{position:sticky;bottom:14px;z-index:20;display:grid;gap:8px;padding:0 14px;pointer-events:none}

/* stamp card */
.scard{position:relative;margin-top:18px;border-radius:20px;background:var(--secondary);color:#fff;padding:14px 14px 16px;overflow:hidden}
.scard-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:rgba(255,255,255,.78);padding:0 4px}
.scard-top b{color:#fff;font-weight:600;font-size:15px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.slot{text-align:center}
.slot svg{display:block;width:100%;max-width:92px;height:auto;margin:0 auto}

.stamp-img::before{content:"";display:block;padding-top:100%}
.slot .stamp-rot{transform:rotate(var(--r,-8deg))}
.slot.new .stamp-rot{animation:thump .6s cubic-bezier(.2,1.5,.45,1) both}
@keyframes thump{0%{opacity:0;transform:scale(2.3) rotate(-30deg)}55%{opacity:1}100%{opacity:1;transform:scale(1) rotate(var(--r,-8deg))}}
.slot-name{margin-top:6px;font-size:13.5px;font-weight:500}
.slot-time{font-size:12px;color:rgba(255,255,255,.7)}
.slot.miss .slot-name{color:var(--accent)}
.scard.done{box-shadow:0 0 0 3px var(--accent)}
.scard.done.pop{animation:glow 1.1s .45s ease-out both}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(254,194,33,.9)}100%{box-shadow:0 0 0 3px var(--accent)}}
.ribbon{margin-top:14px;border-radius:12px;background:var(--accent);color:var(--secondary);font-weight:600;text-align:center;padding:8px 10px;font-size:14.5px}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:14px;border-radius:14px;background:var(--primary-soft);padding:12px 14px;font-size:14px;color:var(--ink-2)}
.hint svg{flex:none;color:var(--primary);margin-top:1px}
.code-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.code-row b{font-size:18px;font-weight:600;letter-spacing:.14em;color:var(--ink)}
.merge{margin-top:12px;border-top:1px solid var(--line);padding-top:14px}
.merge p{font-size:13.5px;color:var(--ink-2)}
.input{display:block;width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.code-input{text-transform:uppercase;letter-spacing:.2em;font-weight:600;text-align:center}

/* exit results */
.redeem{position:relative;overflow:hidden;border-radius:20px;padding:22px 18px 20px;text-align:center;color:#fff}
.redeem.ok{background:var(--success)}
.redeem.ok::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 34px,rgba(255,255,255,.08) 34px 68px);animation:slide 4s linear infinite;pointer-events:none}
@keyframes slide{to{transform:translateX(96px)}}
.redeem>*{position:relative}
.redeem.done{background:#4A5568}
.redeem h2{font-size:21px;line-height:1.35;font-weight:600;margin-top:12px}
.redeem p{font-size:15px;margin-top:6px;color:rgba(255,255,255,.92)}
.badge-ok{width:68px;height:68px;border-radius:999px;background:#fff;color:var(--success);display:grid;place-items:center;margin:0 auto}
.redeem.done .badge-ok{color:#4A5568}
.badge-ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.live-clock{margin-top:14px;font-size:40px;font-weight:600;line-height:1;letter-spacing:.02em}
.redeem-meta{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.85)}
.redeem-meta b{letter-spacing:.12em;font-weight:600;color:#fff}
.notice{border-radius:18px;padding:18px;background:var(--warning-soft)}
.notice h2{font-size:20px;color:var(--ink)}
.notice p{font-size:15px;color:var(--ink-2);margin-top:6px}
.notice.info{background:var(--primary-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 18px;border-radius:13px;font-weight:600;font-size:15px;transition:background .15s,transform .1s,border-color .15s;white-space:nowrap;cursor:pointer;user-select:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-strong)}
.btn-navy{background:var(--secondary);color:#fff}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:#B8C4D3}
.btn-sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn-link{color:var(--primary);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:999px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- Admin / Dashboard ---------------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--secondary);color:#fff}
.topbar-logo{height:30px;width:auto;display:block}
.tb-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:13.5px;font-weight:500;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,.18)}
.tb-btn.on{background:var(--accent);color:var(--secondary)}
.tab{padding:7px 13px;border-radius:10px;color:rgba(255,255,255,.78);font-weight:500;font-size:14px;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab[aria-selected="true"]{background:#fff;color:var(--secondary)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}
.live i{width:8px;height:8px;border-radius:999px;background:#3BD38A;box-shadow:0 0 0 0 rgba(59,211,138,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(59,211,138,0)}100%{box-shadow:0 0 0 0 rgba(59,211,138,0)}}

.dash{container-type:inline-size;container-name:dash}
.kpis{display:grid;grid-template-columns:1fr 1fr;background:var(--secondary);color:#fff;border-radius:var(--plate);overflow:hidden}
.kpi{padding:15px 18px;border-top:1px solid rgba(255,255,255,.12)}
.kpi:nth-child(2n){border-left:1px solid rgba(255,255,255,.12)}
.kpi-hero{grid-column:1/-1;border-top:0}
.kpi-label{font-size:13px;color:rgba(255,255,255,.74)}
.kpi-value{font-size:30px;font-weight:600;line-height:1.15;margin-top:4px;transition:color .4s}
.kpi-hero .kpi-value{font-size:54px;line-height:1.05}
.kpi-value small{font-size:16px;font-weight:500;color:rgba(255,255,255,.7)}
.kpi-sub{font-size:12.5px;color:rgba(255,255,255,.74);margin-top:2px}
.kpi-value.bump{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel-title{font-size:15.5px;font-weight:600;line-height:1.3}
.panel-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.d-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-top:14px}
.stage-bar{display:flex;gap:2px;height:18px;margin-top:14px;border-radius:0 4px 4px 0;overflow:hidden}
.stage-bar i{display:block;height:100%;transition:flex-grow .5s}
.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stage{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stage-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink)}
.stage-head i{flex:none;width:12px;height:12px;border-radius:3px}
.stage-note{font-size:12.5px;color:var(--muted);margin-left:20px}
.stage-val{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.stage-val b{font-size:30px;font-weight:600;line-height:1.1}
.stage-val span{font-size:13px;color:var(--muted)}
@container dash (min-width:640px){ .stage-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@container dash (min-width:760px){ .d-a{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)} .d-b{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container dash (min-width:940px){
  .kpis{grid-template-columns:1.4fr repeat(4,1fr)}
  .kpi{border-top:0;border-left:1px solid rgba(255,255,255,.12);padding:15px 16px}
  .kpi-hero{grid-column:auto;border-left:0}
  .kpi-value{font-size:25px}
  .kpi-hero .kpi-value{font-size:46px}
  .d-b{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container dash (min-width:1200px){ .kpi-value{font-size:30px} .kpi-hero .kpi-value{font-size:54px} }
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:3px;border-radius:2px}
.bars{display:grid;gap:10px;margin-top:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px}
.bar-label{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-val{color:var(--ink);font-weight:500;text-align:right;white-space:nowrap}
.bar-val small{color:var(--muted);font-weight:400;margin-left:5px}
.bar-track{grid-column:1/-1;height:12px;background:var(--primary-soft);border-radius:0 4px 4px 0}
.bar-fill{display:block;height:100%;background:var(--primary);border-radius:0 4px 4px 0;transition:width .5s}
.feed{display:grid;margin-top:8px}
.feed li{display:grid;grid-template-columns:44px 10px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EDF1F6;font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--muted);font-size:12.5px}
.feed i{width:8px;height:8px;border-radius:999px}
.feed b{font-weight:600;letter-spacing:.06em;color:var(--ink)}
.feed .new{animation:feedIn .6s ease-out}
@keyframes feedIn{from{background:var(--accent-soft)}}
.empty{color:var(--muted);font-size:13.5px;padding:14px 0}

/* gate */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--secondary)}
.gate-card{width:100%;max-width:380px;background:var(--surface);border-radius:var(--plate);padding:28px 24px 24px;text-align:center}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.pin-dots i{width:14px;height:14px;border-radius:999px;border:2px solid #B8C4D3;transition:all .12s}
.pin-dots i.on{background:var(--secondary);border-color:var(--secondary)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.key{height:58px;border-radius:16px;background:var(--bg);font-size:24px;font-weight:500;color:var(--ink);transition:background .12s,transform .08s}
.key:hover{background:#E3EAF3}
.key:active{transform:scale(.96)}

/* showcase */
.show{display:grid;gap:22px;align-items:start;grid-template-columns:minmax(0,1fr)}
@media (min-width:1180px){.show{grid-template-columns:420px minmax(0,1fr)}.show-left{position:sticky;top:84px}}
.pts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pt{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 6px 9px;text-align:center;font-size:12.5px;font-weight:500;color:var(--ink-2);line-height:1.3;transition:border-color .15s,transform .1s}
.pt svg{width:100%;max-width:70px;height:auto;display:block;margin:0 auto 6px;border-radius:4px}
.pt:hover{border-color:var(--primary)}
.pt:active{transform:scale(.96)}
.pt.exit{background:var(--secondary);border-color:var(--secondary);color:#fff}
.phone{position:relative;width:390px;max-width:100%;height:min(780px,calc(100vh - 290px));min-height:600px;margin:14px auto 0;border-radius:48px;background:#0A1528;padding:11px;box-shadow:0 40px 60px -40px rgba(10,21,40,.8)}
.phone::before{content:"";position:absolute;z-index:5;top:20px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:999px;background:#0A1528}
.phone-screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg)}

/* QR kit */
.kit{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kit-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.kit-card svg{width:160px;height:160px;margin:10px auto 0;display:block}

/* modal + toast */
.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;display:grid;gap:8px;width:min(92vw,440px)}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--secondary);color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;box-shadow:0 18px 30px -18px rgba(0,0,0,.5);animation:pop .2s;pointer-events:auto}
.toast.err{background:var(--danger)}
.toast.ok svg{color:var(--accent)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.demo-bar{background:var(--accent);color:var(--secondary);font-size:13px;text-align:center;padding:7px 12px;font-weight:500}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="demo-bar" class="demo-bar" hidden></div>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

function makeQR(text) {
  if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

function qrSVG(text, quiet = 1) {
  const qr = makeQR(text), n = qr.getModuleCount(), size = n + quiet * 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + quiet) + ' ' + (r + quiet) + 'h1v1h-1z';
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#0E1C30"/></svg>';
}

}

/* ---- SHARED: สรุปผล Stamp Rally (ใช้ทั้งฝั่ง Apps Script และหน้าเว็บโหมดตัวอย่าง) ----
 * players: [{ code, ch: 'LINE'|'WEB', b: [ms|null, ms|null, ms|null], red: ms|null, fails: number }]
 * cfg:     { boothNames: [3 ชื่อ], nowMs, startMin, step }
 * เวลาใช้เขตเวลาไทย (UTC+7 ไม่มี Daylight saving)
 */
function buildStampSummary(players, cfg) {
  var step = cfg.step || 15;
  var names = cfg.boothNames || ['บูธที่ 1', 'บูธที่ 2', 'บูธที่ 3'];
  var tod = function (ms) { return Math.floor(((ms / 60000) + 420) % 1440); };
  var hhmm = function (m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); };
  var groups = [0, 0, 0, 0], booths = [0, 0, 0], line = 0, fails = 0, durs = [], events = [], firsts = [], reds = [];

  players.forEach(function (p) {
    var ts = (p.b || []).filter(function (t) { return !!t; });
    if (!ts.length) return;
    var cnt = Math.min(ts.length, 3);
    if (p.red) groups[3]++; else if (cnt >= 3) groups[2]++; else groups[cnt - 1]++;
    (p.b || []).forEach(function (t, i) { if (t) { booths[i]++; events.push({ ms: t, type: 'stamp', code: p.code, booth: i }); } });
    if (p.red) { reds.push(p.red); events.push({ ms: p.red, type: 'redeem', code: p.code }); }
    if (p.ch === 'LINE') line++;
    fails += Number(p.fails) || 0;
    var first = Math.min.apply(null, ts);
    firsts.push(first);
    if (cnt >= 3) durs.push((Math.max.apply(null, ts) - first) / 60000);
  });

  var n = firsts.length;
  durs.sort(function (a, b) { return a - b; });
  var median = durs.length ? Math.round(durs.length % 2 ? durs[(durs.length - 1) / 2] : (durs[durs.length / 2 - 1] + durs[durs.length / 2]) / 2) : null;
  var pct = function (a) { return n ? Math.round((a * 1000) / n) / 10 : 0; };

  // timeline ทุก 15 นาที
  var nowMin = cfg.nowMs ? tod(cfg.nowMs) : null;
  var all = firsts.concat(reds).map(tod);
  var lo = Math.min.apply(null, [cfg.startMin != null ? cfg.startMin : 1050].concat(all));
  var live = nowMin != null && nowMin >= lo;
  var hi = Math.max.apply(null, [lo + step].concat(all).concat(live ? [nowMin] : [lo + step * 6]));
  lo = Math.floor(lo / step) * step;
  hi = Math.min(Math.floor(hi / step) * step, 1440 - step);
  var labels = [], newB = [], redB = [];
  for (var m = lo; m <= hi; m += step) { labels.push(hhmm(m)); newB.push(0); redB.push(0); }
  var idx = function (ms) { return Math.max(0, Math.min(labels.length - 1, Math.floor((tod(ms) - lo) / step))); };
  firsts.forEach(function (t) { newB[idx(t)]++; });
  reds.forEach(function (t) { redB[idx(t)]++; });
  var cumP = [], cumR = [], a = 0, z = 0;

/* =====================================================================
   DEMO BACKEND — จำลองเซิร์ฟเวอร์และผู้เล่น ~700 คนในเบราว์เซอร์
   ===================================================================== */
const Demo = (() => {
  const KEY = 'axs_demo_v1', PIN = '111111';
  const T = h => Date.parse(CONFIG.EVENT_DATE + 'T' + h + ':00+07:00');
  const START = T('17:30'), SEED_END = T('18:40'), LAST = T('19:45'), END = T('20:00');
  const FIRST = 'ABCDEFGHJKMNPQRSTUVWXYZ', REST = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
  const listeners = new Set();
  const rng = seed => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const sign = s => { let h = 2166136261, h2 = 5381; for (const ch of 'demo|' + s) { const c = ch.charCodeAt(0); h ^= c; h = Math.imul(h, 16777619); h2 = (Math.imul(h2, 33) + c) | 0; } return ((h >>> 0).toString(36) + (h2 >>> 0).toString(36) + 'q7k2w9m4').slice(0, 14); };
  const pointSig = id => sign('pt|' + id).slice(0, 8);
  const cardKey = code => sign('card|' + String(code).toUpperCase()).slice(0, 12);
  let rnd = rng(1), db, vt, speed = 1, lastTick = Date.now(), simTimer = null, saveTimer = null;
  const used = () => new Set(db.players.map(p => p.code));
  function newCode(set) { let c; do { c = FIRST[Math.floor(rnd() * FIRST.length)]; for (let i = 0; i < 4; i++) c += REST[Math.floor(rnd() * REST.length)]; } while (set.has(c)); set.add(c); return c; }
  function seed() {
    rnd = rng(20261114);
    const players = [], set = new Set(), min = 60000, R = (a, b) => (a + rnd() * (b - a)) * min;
    for (let i = 0; i < 700; i++) {
      const arrive = START + Math.pow((rnd() + rnd() + rnd()) / 3, 1.25) * (LAST - START);
      const first = rnd() < 0.38 ? 0 : rnd() < 0.55 ? 1 : 2;
      const order = [first].concat([0, 1, 2].filter(x => x !== first).sort(() => rnd() - 0.5));
      const p = { code: newCode(set), ch: rnd() < 0.86 ? 'LINE' : 'WEB', b: [null, null, null], red: null, fails: [], mergedInto: '' };
      let t = arrive;
      for (let k = 0; k < 3; k++) {
        if ((k === 1 && rnd() > 0.86) || (k === 2 && rnd() > 0.9)) break;
        if (k) t += R(6, 16);
        if (t > END) break;
        p.b[order[k]] = Math.round(t);
      }
      const n = p.b.filter(Boolean).length;
      if (n === 3 && rnd() < 0.93) { const r = t + R(3, 18); if (r <= END) p.red = Math.round(r); }
      if (n < 3 && rnd() < 0.2) { const f = t + R(8, 15); if (f <= END) p.fails.push(Math.round(f)); }
      players.push(p);
    }
    return { players, vt: SEED_END };
  }
  function load() {
    db = store.get(KEY, null);
    if (!db || !Array.isArray(db.players) || !(db.vt < END)) db = seed();
    vt = db.vt; lastTick = Date.now(); rnd = rng(Date.now() % 100000);
  }
  function saveNow() { clearTimeout(saveTimer); db.vt = vt; store.set(KEY, db); }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }
  addEventListener('pagehide', () => { if (db) saveNow(); });
  function emit() { listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }
  function now() { const t = Date.now(); vt = Math.min(END, vt + (t - lastTick) * speed); lastTick = t; return vt; }
  const real = (p, t) => ({ code: p.code, ch: p.ch, b: p.b.map(x => (x && x <= t ? x : null)), red: p.red && p.red <= t ? p.red : null, fails: p.fails.filter(x => x <= t).length, mergedInto: p.mergedInto });
  const count = p => p.b.filter(Boolean).length;
  const status = p => (p.mergedInto ? 'รวมกับ ' + p.mergedInto : p.red ? 'แลกของแล้ว' : count(p) >= 3 ? 'ครบ 3 บูธ ยังไม่แลก' : count(p) ? 'สแกน ' + count(p) + ' บูธ' : '');
  const cardOut = (p, t) => { const r = real(p, t); return { code: p.code, key: cardKey(p.code), stamps: r.b, count: count(r), redeemedAt: r.red, channel: p.ch, tel4: p.tel4 || '' }; };
  const normTel = v => { let d = String(v || '').replace(/\D/g, ''); if (/^66\d{9}$/.test(d)) d = '0' + d.slice(2); return /^0\d{9}$/.test(d) ? d : ''; };
  const telKey = tel => sign('tel|' + tel);
  const byTel = tel => { let p = db.players.find(x => x.tk === telKey(tel)); if (p && p.mergedInto) p = find(p.mergedInto) || p; return p || null; };
  const cardFor = (code, key, tel) => { const dev = findCard(code, key); if (!tel) return dev; const bt = byTel(tel); if (bt) return bt; return dev && !dev.tk ? dev : null; };
  const ok = (data, message = '', code = 'OK') => ({ success: true, code, message, data: JSON.parse(JSON.stringify(data)) });
  const fail = (code, message, data = null) => ({ success: false, code, message, data });
  const find = c => db.players.find(p => p.code === c);
  function findCard(code, key) {
    code = String(code || '').toUpperCase();
    if (!code || key !== cardKey(code)) return null;
    let p = find(code);
    if (p && p.mergedInto) p = find(p.mergedInto) || p;
    return p || null;
  }
  function parsePoint(s) { const m = String(s || '').match(/^(B[123]|EX)-([A-Za-z0-9]{6,12})$/); return m && m[2] === pointSig(m[1]) ? m[1] : null; }
  function freeze(p, t) { p.b = p.b.map(x => (x && x <= t ? x : null)); if (p.red && p.red > t) p.red = null; p.fails = p.fails.filter(x => x <= t); }
  function simStep() {
    const t = now();
    if (t >= END) { api.simulate(false); toast('งานจบแล้ว 20:00 น. กด "เริ่มข้อมูลใหม่" เพื่อเล่นอีกรอบ'); if (api.onSimChange) api.onSimChange(false); }
    save(); emit();
  }
  async function handle(req) {
    await sleep(140 + Math.random() * 200);
    const t = now();
    switch (req.action) {
      case 'config': return ok({ eventName: CONFIG.EVENT_NAME, boothNames: CONFIG.BOOTH_NAMES, exitName: CONFIG.EXIT_NAME, publicUrl: '', prototype: true });
      case 'scan': {
        const pt = parsePoint(req.s);
        if (!pt) return fail('BAD_QR', TEXT.badQr.join(' '));
        const tel = normTel(req.tel);
        if (req.tel && !tel) return fail('BAD_TEL', 'กรุณากรอกเบอร์มือถือ 10 หลัก เช่น 0812345678');
        let p = cardFor(req.code, req.key, tel), result;
        if (!p && !tel) return ok({ result: 'NEED_TEL', point: pt });
        if (p) freeze(p, t);
        if (pt === 'EX') {
          if (!p) return ok({ result: 'NO_CARD', point: pt, tel4: tel.slice(-4) });
          if (p.red) result = 'ALREADY';
          else if (count(p) < 3) { p.fails.push(t); result = 'INCOMPLETE'; }
          else { p.red = t; result = 'REDEEMED'; }
        } else {
          const i = Number(pt[1]) - 1;
          if (!p) { p = { code: newCode(used()), ch: req.ch === 'LINE' ? 'LINE' : 'WEB', b: [null, null, null], red: null, fails: [], mergedInto: '', mine: true }; db.players.push(p); }
          if (tel && !p.tk) { p.tk = telKey(tel); p.tel4 = tel.slice(-4); }
          if (p.red) result = 'ALREADY';
          else if (p.b[i]) result = 'DUP';
          else { p.b[i] = t; result = 'NEW_STAMP'; }
        }
        saveNow(); emit();
        return ok({ result, point: pt, card: cardOut(p, t) });
      }
      case 'state': { const tel = normTel(req.tel); const p = cardFor(req.code, req.key, tel); return p ? ok({ card: cardOut(p, t) }) : fail('NOT_FOUND', tel ? 'ยังไม่มีบัตรของเบอร์นี้ สแกน QR ที่บูธเพื่อเริ่มสะสมได้เลยค่ะ' : 'ไม่พบบัตรในเครื่องนี้'); }
      case 'merge': {
        const target = String(req.target || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!/^[A-Z][A-Z0-9]{4}$/.test(target)) return fail('INVALID', 'รหัสมี 5 ตัว เช่น K7Q2X');
        let tp = find(target);
        if (!tp) return fail('NOT_FOUND', 'ไม่พบรหัส ' + target + ' กรุณาตรวจสอบอีกครั้ง');
        if (tp.mergedInto) tp = find(tp.mergedInto) || tp;
        freeze(tp, t);
        const c = findCard(req.code, req.key);
        if (c && c.code !== tp.code) {
          freeze(c, t);
          tp.b = tp.b.map((x, i) => (c.b[i] && (!x || c.b[i] < x) ? c.b[i] : x));
          if (c.red && (!tp.red || c.red < tp.red)) tp.red = c.red;
          tp.fails = tp.fails.concat(c.fails);
          c.mergedInto = tp.code;
        }
        saveNow(); emit();
        return ok({ card: cardOut(tp, t) }, 'รวม Stamp แล้ว');
      }
      case 'login': if (req.pin !== PIN) { await sleep(600); return fail('BAD_PIN', 'PIN ไม่ถูกต้อง'); } return ok({ token: 'demo.staff', role: 'staff', expiresAt: Date.now() + 14 * 3600e3 });
      case 'session': return req.token === 'demo.staff' ? ok({ role: 'staff' }) : fail('AUTH', 'กรุณาใส่ PIN อีกครั้ง');
      case 'dashboard': {
        if (req.token !== 'demo.staff') return fail('AUTH', 'กรุณาใส่ PIN อีกครั้ง');
        const list = db.players.filter(p => !p.mergedInto).map(p => real(p, t));
        return ok({ summary: buildStampSummary(list, { boothNames: CONFIG.BOOTH_NAMES, nowMs: t, startMin: 1050, step: 15 }), generatedAt: t, eventName: CONFIG.EVENT_NAME, prototype: true });
      }
      case 'export': {
        if (req.token !== 'demo.staff') return fail('AUTH', 'กรุณาใส่ PIN อีกครั้ง');
        const rows = db.players.filter(p => !p.mergedInto).map(p => real(p, t)).filter(r => count(r)).map(r => {
          const ts = r.b.filter(Boolean), first = Math.min.apply(null, ts), fi = r.b.indexOf(first);
          return { code: r.code, createdAt: fmtDT(first), firstBooth: 'B' + (fi + 1), b1: fmtDT(r.b[0]), b2: fmtDT(r.b[1]), b3: fmtDT(r.b[2]), stamps: ts.length,
            completedAt: ts.length === 3 ? fmtDT(Math.max.apply(null, ts)) : '', redeemedAt: fmtDT(r.red), status: status(r), channel: r.ch, exitFails: r.fails };
        });
        return ok({ players: rows, boothNames: CONFIG.BOOTH_NAMES, generatedAt: t, eventName: CONFIG.EVENT_NAME });
      }
      case 'points': {
        if (req.token !== 'demo.staff') return fail('AUTH', 'กรุณาใส่ PIN อีกครั้ง');
        const names = CONFIG.BOOTH_NAMES.concat([CONFIG.EXIT_NAME]);
        return ok({ publicUrl: '', points: ['B1', 'B2', 'B3', 'EX'].map((id, i) => ({ id, name: names[i], s: id + '-' + pointSig(id) })) });
      }
      default: return fail('UNKNOWN_ACTION', 'ไม่รู้จักคำสั่ง');
    }
  }
  load();
  const api = {
    handle, PIN, on: fn => { listeners.add(fn); return () => listeners.delete(fn); },
    clock: () => now(), ended: () => now() >= END,
    simulating: () => !!simTimer,
    simulate(on) {

      if (!on && simTimer) { now(); clearInterval(simTimer); simTimer = null; speed = 1; save(); }
    },
    reset() { this.simulate(false); store.del(KEY); db = seed(); vt = SEED_END; lastTick = Date.now(); rnd = rng(Date.now() % 100000); save(); emit(); }
  };
  return api;
})();

/* =====================================================================
   BACKEND — google.script.run / fetch REST / Demo
   ===================================================================== */
const Backend = (() => {
  const inGAS = !!(window.google && google.script && google.script.run);
  const mode = inGAS ? 'gas' : GAS_URL ? 'rest' : 'demo';
  // สำรอง: บางแอปเปิดลิงก์แล้ว google.script.run ใช้ไม่ได้ → ส่งตรงไปที่ URL ของ Web app แทน
  const restUrl = () => (inGAS && window.__EXEC_URL) || GAS_URL || window.__EXEC_URL || '';
  let useRest = false;
  const viaGAS = req => new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('TIMEOUT')), 25000);
    try { google.script.run.withSuccessHandler(v => { clearTimeout(t); res(v); }).withFailureHandler(e => { clearTimeout(t); rej(e); }).api(req); }
    catch (e) { clearTimeout(t); rej(e); }
  });
  async function viaREST(req) {
    const r = await fetch(restUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  async function call(action, payload = {}) {
    const req = Object.assign({}, payload, { action });
    if (mode === 'demo') return Demo.handle(JSON.parse(JSON.stringify(req)));
    let last;
    for (let i = 0; i < 3; i++) {
      try { return mode === 'rest' || useRest ? await viaREST(req) : await viaGAS(req); }
      catch (e) {
        last = e;
        if (mode === 'gas' && restUrl()) useRest = !useRest;   // สลับไปลองอีกช่องทาง
        await sleep(600 * (i + 1) + Math.random() * 900);
      }
    }
    throw last;
  }
  function params() {
    if (inGAS && google.script.url) return new Promise(res => google.script.url.getLocation(l => res(l.parameter || {})));
    const o = {}; new URLSearchParams(location.search).forEach((v, k) => { o[k] = v; }); return Promise.resolve(o);
  }
  function replaceParams(p) {
    try {
      if (mode === 'gas' && google.script.history) google.script.history.replace(null, p, '');
      else history.replaceState(null, '', location.pathname + '?' + new URLSearchParams(p).toString());
    } catch (e) { /* ignore */ }
  }
  return { mode, call, params, replaceParams };
})();
const nowMs = () => (Backend.mode === 'demo' ? Demo.clock() : Date.now());

const State = {
  config: { eventName: CONFIG.EVENT_NAME, boothNames: CONFIG.BOOTH_NAMES, exitName: CONFIG.EXIT_NAME, publicUrl: '', prototype: Backend.mode === 'demo' },
  loaded: null,

    if (!this.loaded) this.loaded = Backend.call('config').then(r => { if (r && r.success) Object.assign(this.config, r.data); return this.config; }).catch(() => this.config);
    return this.loaded;
  },
  // ลิงก์ที่ใส่ใน QR: APP_URL จากชีต Settings > หน้าที่โฮสต์อยู่ (GitHub Pages) > URL ของ Apps Script
  base() {

/* =====================================================================
   CUSTOMER — หน้าจอมือถือของลูกค้า
   ===================================================================== */
const CARD_KEY = 'axs_card';
/* บัตรสะสมเก็บ 3 ที่: ในหน้าที่เปิดอยู่ (หลักเมื่อสแกนด้วยปุ่มในหน้า) + localStorage + cookie สำรอง */
const CardStore = {
  ok(c) { return c && /^[A-Z][A-Z0-9]{4}$/.test(c.code || '') && /^[A-Za-z0-9_-]{6,24}$/.test(c.key || '') ? { code: c.code, key: c.key } : null; },
  read() {
    const ls = this.ok(store.get(CARD_KEY, null));
    if (ls) return ls;
    try {
      const m = document.cookie.match(/(?:^|;\s*)axs_card=([^;]+)/);
      if (m) { const [code, key] = decodeURIComponent(m[1]).split('.'); return this.ok({ code, key }); }
    } catch (e) { /* cookie ปิด */ }
    return null;
  },
  write(c) {
    c = this.ok(c); if (!c) return;
    store.set(CARD_KEY, c);
    try { document.cookie = 'axs_card=' + encodeURIComponent(c.code + '.' + c.key) + '; Max-Age=259200; Path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : ''); } catch (e) { /* ignore */ }
  },
  clear() {
    store.del(CARD_KEY);
    try { document.cookie = 'axs_card=; Max-Age=0; Path=/'; } catch (e) { /* ignore */ }
  }
};

class Cust {
  constructor(root, { embedded = false, channel } = {}) {
    this.root = root; this.embedded = embedded; this.channel = channel || (IS_LINE ? 'LINE' : 'WEB');
    root.innerHTML = '<div class="cust' + (embedded ? ' embedded' : '') + '"><header class="c-head"><div class="c-smile">' + ICON.smile + '</div><img class="logo" src="' + CONFIG.LOGO + '" alt="AXTRA Club"><h1 class="c-title">' + esc(CONFIG.TITLE) + '</h1><p class="c-sub">' + esc(CONFIG.SUBTITLE) + '</p></header><main class="c-body"><section class="sheet" data-sheet aria-live="polite"></section></main><footer class="c-foot">' + esc(State.config.eventName) + '</footer><div class="c-toasts" data-toasts></div></div>';
    this.el = $('.cust', root); this.sheet = $('[data-sheet]', root); this.toasts = $('[data-toasts]', root);
  }
  // บัตรในหน้าที่เปิดอยู่มาก่อน เผื่อเบราว์เซอร์ไม่เก็บข้อมูลข้ามหน้า
  get card() { return this.mem || CardStore.read(); }
  saveCard(c) { if (c) { this.mem = CardStore.ok(c); CardStore.write(c); } }
  forget() { this.mem = null; CardStore.clear(); }
  // รองรับเบอร์ที่มือถือเติมให้เอง เช่น +66 81 234 5678 → 081-234-5678
  fmtTel(d) { d = String(d || '').replace(/\D/g, ''); if (/^66[1-9]\d{8}/.test(d)) d = '0' + d.slice(2); d = d.slice(0, 10); return d.length > 6 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d; }
  normTel(v) { let d = String(v || '').replace(/\D/g, ''); if (/^66\d{9}$/.test(d)) d = '0' + d.slice(2); return /^0\d{9}$/.test(d) ? d : ''; }
  top() { if (this.embedded) this.el.scrollTop = 0; else window.scrollTo(0, 0); }
  names() { return State.config.boothNames || CONFIG.BOOTH_NAMES; }
  loading(text) { this.sheet.innerHTML = '<div class="flex items-center justify-center gap-3 py-12 muted"><span class="spin"></span>' + esc(text) + '</div>'; }
  async scan(s, rid, tel) {
    // rid: รหัสของการสแกนครั้งนี้ ถ้าต้องส่งซ้ำ (เน็ตหลุด / กดลองอีกครั้ง) ระบบจะตอบผลเดิม
    rid = rid || (Math.random().toString(36).slice(2, 10) + Date.now().toString(36));
    this.top(); this.loading('กำลังบันทึก…');
    const me = this.card || {};
    try {
      let r;
      // คนสแกนพร้อมกันเยอะ → รอสักครู่แล้วส่งใหม่ให้เอง (rid เดิม ระบบไม่นับซ้ำ)
      for (let i = 0, fails = 0; ; i++) {
        try { r = await Backend.call('scan', { s, code: me.code, key: me.key, tel: tel || undefined, ch: this.channel, rid }); }
        catch (e) { if (++fails > 2 || navigator.onLine === false) throw e; r = { success: false, code: 'BUSY' }; }   // ระบบ Google รับไม่ทัน (เกิน 30 คำขอพร้อมกัน) → ลองใหม่
        if (r.success || !/^(BUSY|SERVER_ERROR)$/.test(r.code) || i >= 5) break;
        this.loading(TEXT.busy);
        await sleep(1200 + Math.random() * 2300);
      }
      if (!r.success && r.code === 'BAD_TEL') return this.render({ kind: 'tel', s, error: r.message });
      if (!r.success) return this.render({ kind: r.code === 'BAD_QR' ? 'bad' : 'error', message: r.message, retry: r.code === 'BAD_QR' ? null : () => this.scan(s, rid, tel) });
      // เครื่องจำบัตรไม่ได้ → ขอเบอร์มือถือ (บัตรผูกกับเบอร์ ล้างเบราว์เซอร์ก็กลับมาได้)
      if (r.data.result === 'NEED_TEL') return this.render({ kind: 'tel', s });
      if (!this.embedded) Backend.replaceParams({ p: 'card' });
      if (r.data.card) this.saveCard(r.data.card);
      this.render({ kind: r.data.point === 'EX' ? 'exit' : 'booth', result: r.data.result, card: r.data.card, point: r.data.point, tel4: r.data.tel4, s });
    } catch (e) {
      this.render({ kind: 'error', message: 'เชื่อมต่อไม่ได้ กรุณาลองอีกครั้งค่ะ', retry: () => this.scan(s, rid, tel) });
    }
  }
  async lookup(tel) {
    this.top(); this.loading('กำลังค้นหาบัตร…');
    try {
      const r = await Backend.call('state', { tel });
      if (!r.success) return this.render({ kind: 'intro', lookupError: r.message, showLookup: true });
      this.saveCard(r.data.card);
      this.render({ kind: 'card', card: r.data.card });
    } catch (e) { this.render({ kind: 'error', message: 'เชื่อมต่อไม่ได้ กรุณาลองอีกครั้ง', retry: () => this.lookup(tel) }); }
  }
  async open() {
    const me = this.card;
    if (!me) return this.render({ kind: 'intro' });
    this.loading('กำลังเปิดบัตร…');
    try {
      const r = await Backend.call('state', { code: me.code, key: me.key });
      if (!r.success && r.code === 'NOT_FOUND') { this.forget(); return this.render({ kind: 'intro' }); }
      if (!r.success) return this.render({ kind: 'error', message: r.message || 'ระบบไม่ว่าง กรุณาลองอีกครั้ง', retry: () => this.open() });
      this.saveCard(r.data.card);
      this.render({ kind: 'card', card: r.data.card });
    } catch (e) { this.render({ kind: 'error', message: 'เชื่อมต่อไม่ได้ กรุณาลองอีกครั้ง', retry: () => this.open() }); }
  }
  stampSVG(i, got) {
    const n = i + 1;
    if (!got) return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-dasharray="6 6"/><text x="50" y="62" text-anchor="middle" font-size="34" font-weight="600" fill="rgba(255,255,255,.45)" font-family="Prompt, sans-serif">' + n + '</text></svg>';
    return '<div class="stamp-img" aria-hidden="true"></div>';   // ไอคอน Stamp (src/stamp.png)
  }
  cardHTML(card, { newIndex = -1, highlightMissing = false, pop = false } = {}) {
    const st = card ? card.stamps : [null, null, null], cnt = st.filter(Boolean).length, rot = ['-8deg', '6deg', '-4deg'];
    return '<div class="scard' + (cnt === 3 ? ' done' + (pop ? ' pop' : '') : '') + '" role="group" aria-label="บัตรสะสม Stamp ได้ ' + cnt + ' จาก 3 ดวง">' +
      '<div class="scard-top"><span>STAMP CARD</span><b class="tnum">' + cnt + ' / 3</b></div><div class="stamps">' +
      st.map((t, i) => '<div class="slot' + (t ? ' got' : '') + (i === newIndex ? ' new' : '') + (!t && highlightMissing ? ' miss' : '') + '" style="--r:' + rot[i] + '"><div class="stamp-rot">' + this.stampSVG(i, !!t) + '</div><div class="slot-name">' + esc(this.names()[i]) + '</div><div class="slot-time tnum">' + (t ? hm(t) + ' น.' : highlightMissing ? 'ยังขาด' : 'ยังไม่ได้') + '</div></div>').join('') +
      '</div>' + (cnt === 3 && !(card && card.redeemedAt) ? '<div class="ribbon">พร้อมรับของที่ระลึกที่ประตูทางออก</div>' : '') + '</div>';
  }
  hint(card) {
    if (!card || card.redeemedAt) return '';
    const t4 = card.tel4 ? ' ลงท้าย <b>' + esc(card.tel4) + '</b>' : '';
    const where = card.count >= 3 ? 'ไปสแกน QR ที่<b>ประตูทางออก</b>ด้วยกล้องได้เลย' : 'บูธต่อไปสแกน QR ด้วย<b>กล้องมือถือ</b>ได้เลย';
    return '<div class="hint">' + ICON.phone + '<span>' + where + ' ถ้าระบบถามเบอร์ ให้กรอกเบอร์เดิม' + t4 + ' Stamp จะรวมอยู่ในบัตรใบเดียวกันค่ะ</span></div>';
  }
  telForm(s, error) {
    const ex = s && String(s).startsWith('EX'), pt = s ? String(s).slice(0, 2) : '', idx = /^B[123]$/.test(pt) ? Number(pt[1]) - 1 : -1;
    const chip = ex ? 'จุดรับของที่ระลึก' : idx > -1 ? 'สะสม Stamp ' + this.names()[idx] : '';
    const demoTel = this.embedded ? '08' + String(Math.floor(10000000 + Math.random() * 89999999)) : '';
    return (chip ? '<div class="tel-chip">' + esc(chip) + '</div>' : '') +
      '<h2>' + (ex ? 'กรอกเบอร์มือถือเพื่อรับของที่ระลึก' : s ? 'กรอกเบอร์มือถือเพื่อสะสม Stamp' : 'ดูบัตรสะสมด้วยเบอร์มือถือ') + '</h2>' +
      '<p class="lead">' + (s ? 'ใช้เบอร์เดิมทุกครั้งที่ระบบถาม Stamp จะรวมอยู่ในบัตรใบเดียวกัน แม้เปลี่ยนแอปหรือล้างเบราว์เซอร์' : 'กรอกเบอร์ที่ใช้ตอนสะสม Stamp') + '</p>' +
      '<form class="tel-form" data-tel-form novalidate><label class="tel-label" for="tel-input">เบอร์มือถือ</label>' +
      '<input id="tel-input" class="input tel-input tnum" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20" placeholder="08x-xxx-xxxx" value="' + esc(this.fmtTel(demoTel)) + '" data-tel-input>' +
      '<p class="tel-err" data-tel-err' + (error ? '' : ' hidden') + '>' + esc(error || '') + '</p>' +
      '<button type="submit" class="btn btn-primary w-full mt-3" data-tel-go>' + (ex ? 'ตรวจสอบ Stamp' : s ? 'รับ Stamp' : 'ดูบัตรของฉัน') + '</button></form>' +
      '<p class="tel-note">ระบบเก็บเบอร์แบบเข้ารหัส ใช้เพื่อจำบัตรสะสมของคุณเท่านั้น</p>';
  }
  codeRow(card) {
    if (!card) return '';
    return '<div class="code-row"><span>รหัสของคุณ</span><b class="tnum">' + esc(card.code) + '</b></div>' +
      (card.tel4 ? '<div class="tel-row"><span>เบอร์มือถือ</span><b class="tnum">xxx-xxx-' + esc(card.tel4) + '</b></div>' : '') +
      '<div class="mt-3 text-center"><button type="button" class="btn-link text-[13px]" data-forget>ไม่ใช่บัตรของคุณ? ใช้เบอร์อื่น</button></div>';
  }
  tx(s, vars = {}) {
    const v = Object.assign({ event: State.config.eventName || CONFIG.EVENT_NAME }, vars);
    return String(s).replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));
  }
  msg(pair, vars = {}) { return '<h2>' + esc(this.tx(pair[0], vars)) + '</h2><p class="lead">' + esc(this.tx(pair[1], vars)) + '</p>'; }
  missingText(card) {
    const m = this.names().filter((n, i) => !card.stamps[i]);
    return m.length === 1 ? 'เพียง ' + m[0] + ' เท่านั้น' : ' ' + m.length + ' บูธ คือ ' + m.join(' และ ');
  }
  render(s) {
    this.top();
    const c = s.card;
    let h = '';
    if (s.kind === 'intro') h = this.msg(TEXT.intro) + this.cardHTML(null) + (s.showLookup ? '<div class="mt-5">' + this.telForm(null, s.lookupError) + '</div>' : '<div class="mt-4 text-center"><button type="button" class="btn-link text-[14px]" data-show-lookup>เคยสะสมแล้ว? ดูบัตรด้วยเบอร์มือถือ</button></div>');
    else if (s.kind === 'tel') h = this.telForm(s.s, s.error);
    else if (s.kind === 'bad') h = '<div class="notice">' + this.msg(TEXT.badQr) + '</div>';
    else if (s.kind === 'error') h = '<div class="notice"><h2>ยังบันทึกไม่ได้</h2><p>' + esc(s.message) + '</p>' + (s.retry ? '<button type="button" class="btn btn-navy mt-4" data-retry>ลองอีกครั้ง</button>' : '') + '</div>';
    else if (s.kind === 'booth' || s.kind === 'card') {
      const cnt = c.count, idx = s.point ? Number(s.point[1]) - 1 : -1;
      if (c.redeemedAt) h = this.redeemedHTML(c);
      else {
        let pair;
        if (s.kind === 'card') pair = cnt >= 3 ? TEXT.dupComplete : cnt === 0 ? TEXT.intro : ['บัตรสะสม Stamp ของคุณ', 'สะสมอีก ' + (3 - cnt) + ' บูธ แล้วนำไปรับของที่ระลึกที่ประตูทางออกนะคะ'];
        else if (s.result === 'DUP') pair = cnt >= 3 ? TEXT.dupComplete : TEXT.dup;
        else pair = cnt >= 3 ? TEXT.complete : cnt === 2 ? TEXT.second : TEXT.first;
        const fresh = s.result === 'NEW_STAMP';
        h = this.msg(pair) + this.cardHTML(c, { newIndex: fresh ? idx : -1, pop: fresh && cnt === 3 }) + this.hint(c) + this.codeRow(c);
      }
    } else if (s.kind === 'exit') {
      if (s.result === 'NO_CARD') h = '<div class="notice">' + this.msg(TEXT.noCard, { tel4: s.tel4 || '' }) + '</div><button type="button" class="btn btn-navy w-full mt-4" data-retel>กรอกเบอร์อีกครั้ง</button>';
      else if (s.result === 'INCOMPLETE') h = '<div class="notice">' + this.msg(TEXT.exitIncomplete, { n: c.count, missing: this.missingText(c) }) + '</div>' + this.cardHTML(c, { highlightMissing: true }) + this.hint(c) + this.codeRow(c);
      else if (s.result === 'REDEEMED') h = '<div class="redeem ok"><div class="badge-ok">' + ICON.okBig + '</div><h2>' + esc(this.tx(TEXT.exitOk[0])) + '</h2><p>' + esc(this.tx(TEXT.exitOk[1])) + '</p><div class="live-clock tnum" data-clock>' + hms(nowMs()) + '</div><div class="redeem-meta">รหัส <b>' + esc(c.code) + '</b><br>บันทึกการรับเมื่อ ' + hm(c.redeemedAt) + ' น.</div></div>' + this.cardHTML(c);
      else h = this.redeemedHTML(c);
    }
    this.sheet.innerHTML = h;
    const rt = $('[data-retry]', this.sheet); if (rt) rt.onclick = s.retry;
    const fg = $('[data-forget]', this.sheet); if (fg) fg.onclick = () => { this.forget(); this.render({ kind: 'intro', showLookup: false }); toast('ออกจากบัตรนี้แล้ว สแกน QR ที่บูธแล้วกรอกเบอร์ของคุณได้เลย', 'ok', this.toasts); };
    const sl = $('[data-show-lookup]', this.sheet); if (sl) sl.onclick = () => this.render({ kind: 'intro', showLookup: true });
    const rtl = $('[data-retel]', this.sheet); if (rtl) rtl.onclick = () => this.render({ kind: 'tel', s: s.s });
    const tf = $('[data-tel-form]', this.sheet);
    if (tf) {
      const inp = $('[data-tel-input]', tf), err = $('[data-tel-err]', tf);
      inp.addEventListener('input', () => { const pos = inp.value; inp.value = this.fmtTel(pos); err.hidden = true; });
      if (!this.embedded) setTimeout(() => { try { inp.focus(); } catch (e) { /* ignore */ } }, 250);
      tf.onsubmit = e => {
        e.preventDefault();
        const tel = this.normTel(inp.value);
        if (!tel) { err.textContent = 'กรุณากรอกเบอร์มือถือ 10 หลัก เช่น 081-234-5678'; err.hidden = false; inp.focus(); return; }
        if (s.kind === 'tel' && s.s) this.scan(s.s, null, tel); else this.lookup(tel);
      };
    }
  }
  redeemedHTML(c) {
    return '<div class="redeem done"><div class="badge-ok">' + ICON.gift + '</div><h2>' + esc(this.tx(TEXT.already[0])) + '</h2><p>' + esc(this.tx(TEXT.already[1], { time: hm(c.redeemedAt) })) + '</p><div class="redeem-meta">รหัส <b>' + esc(c.code) + '</b></div></div>' + this.cardHTML(c);
  }
}

/* =====================================================================
   PIN GATE
   ===================================================================== */
const Gate = {
  async require(root, title) {
    const sess = store.get('axs_session', null);
    if (sess && sess.expiresAt > Date.now()) {
      try { const r = await Backend.call('session', { token: sess.token }); if (r.success) return sess; } catch (e) { /* login ใหม่ */ }
    }
    return new Promise(resolve => {
      root.innerHTML = '<div class="gate"><div class="gate-card"><img class="mx-auto" src="' + CONFIG.LOGO + '" alt="AXTRA Club" style="width:190px;height:auto"><h1 class="mt-5 text-xl font-semibold">' + esc(title) + '</h1><p class="mt-1 text-sm muted">ใส่ PIN 6 หลัก</p>' +
        '<div class="pin-dots" aria-hidden="true">' + '<i></i>'.repeat(6) + '</div><input class="sr" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="PIN" data-pin><p class="text-sm h-5" data-msg style="color:var(--danger)"></p>' +
        '<div class="keypad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k === '' ? '<span></span>' : '<button type="button" class="key" data-k="' + k + '"' + (k === 'del' ? ' aria-label="ลบ"' : '') + '>' + (k === 'del' ? '<span class="grid place-items-center">' + ICON.backspace + '</span>' : k) + '</button>').join('') + '</div>' +
        (Backend.mode === 'demo' ? '<p class="mt-4 text-xs muted">โหมดตัวอย่าง: PIN ' + Demo.PIN + '</p>' : '') + '</div></div>';
      const inp = $('[data-pin]', root), dots = $$('.pin-dots i', root), msg = $('[data-msg]', root);
      const update = async () => {
        dots.forEach((d, i) => d.classList.toggle('on', i < inp.value.length));
        if (inp.value.length < 6) return;
        msg.style.color = 'var(--muted)'; msg.textContent = 'กำลังตรวจสอบ…';
        try {
          const r = await Backend.call('login', { pin: inp.value });
          if (!r.success) throw new Error(r.message);
          store.set('axs_session', r.data); resolve(r.data);
        } catch (e) {
          inp.value = ''; dots.forEach(d => d.classList.remove('on'));
          msg.style.color = 'var(--danger)'; msg.textContent = e.message || 'PIN ไม่ถูกต้อง';
          const box = $('.pin-dots', root); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        }
      };
      $('.keypad', root).addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; inp.value = b.dataset.k === 'del' ? inp.value.slice(0, -1) : (inp.value + b.dataset.k).slice(0, 6); msg.textContent = ''; update(); });
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); update(); });
      $('.gate', root).addEventListener('click', e => { if (!e.target.closest('.key')) inp.focus(); });
      inp.focus();
    });
  }
};

    this.root = root; this.session = session; this.embedded = embedded; this.charts = {}; this.prev = {}; this.seen = new Set();

      '<div class="panel mt-4" data-stages></div>' +
      '<div class="d-grid d-a"><div class="panel"><div class="panel-title">ผู้เล่นและผู้รับของสะสม</div><p class="panel-sub">นับตั้งแต่เริ่มงาน แสดงทุก 15 นาที</p><div class="legend"><span><i style="background:var(--primary)"></i>ผู้เล่น (สแกนบูธแรก)</span><span><i style="background:var(--series-2)"></i>รับของที่ระลึกแล้ว</span></div><div class="relative mt-2" style="height:240px"><canvas data-ch="cum" role="img" aria-label="กราฟผู้เล่นและผู้รับของสะสม"></canvas></div></div><div class="panel" data-booths></div></div>' +

  async refresh() {
    try {
      const [r] = await Promise.all([Backend.call('dashboard', { token: this.session.token }), this.ensureChart()]);
      if (r.code === 'AUTH') { store.del('axs_session'); toast('หมดเวลาเข้าสู่ระบบ กรุณาใส่ PIN ใหม่', 'err'); setTimeout(() => location.reload(), 1500); return; }

      '<div class="stage-grid">' + G.map((g, i) => '<div class="stage"><div class="stage-head"><i style="background:' + STAGE_COLORS[i] + '"></i>' + esc(g.label) + '</div><div class="stage-note">' + esc(g.note) + '</div><div class="stage-val"><b class="tnum">' + nf(g.count) + '</b><span class="tnum">คน (' + g.pct + '%)</span></div></div>').join('') + '</div>';

    if (window.Chart) {
      const css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim(), tl = s.timeline;
      Chart.defaults.font.family = v('--font'); Chart.defaults.color = v('--muted');

const Exporter = {
  cols: [['รหัส', 'code'], ['เริ่มเล่น', 'createdAt'], ['บูธแรก', 'firstBooth'], ['เวลา บูธที่ 1', 'b1'], ['เวลา บูธที่ 2', 'b2'], ['เวลา บูธที่ 3', 'b3'], ['จำนวน Stamp', 'stamps'], ['ครบ 3 บูธเมื่อ', 'completedAt'], ['รับของเมื่อ', 'redeemedAt'], ['สถานะ', 'status'], ['ช่องทาง', 'channel'], ['สแกนจุดรับของตอนยังไม่ครบ (ครั้ง)', 'exitFails'], ['เบอร์ 4 ตัวท้าย', 'phone4']],
  groups: [['กลุ่ม1 สแกน 1 บูธ', 'สแกน 1 บูธ'], ['กลุ่ม2 สแกน 2 บูธ', 'สแกน 2 บูธ'], ['กลุ่ม3 ครบ ยังไม่แลก', 'ครบ 3 บูธ ยังไม่แลก'], ['กลุ่ม4 แลกของแล้ว', 'แลกของแล้ว']],
  aoa(rows, names) {
    const fb = { B1: names[0], B2: names[1], B3: names[2] };
    return [this.cols.map(c => c[0])].concat(rows.map(r => this.cols.map(c => {
      const v = r[c[1]];
      if (c[1] === 'firstBooth') return fb[v] || v || '';
      if (c[1] === 'channel') return v === 'LINE' ? 'LINE' : 'กล้องมือถือ';
      if (c[1] === 'stamps' || c[1] === 'exitFails') return Number(v) || 0;
      return v == null ? '' : String(v);
    })));
  },
  name(ext) { const n = new Date(nowMs() + 7 * 3600e3).toISOString(); return 'AXTRA-Club_Stamp-Rally_' + n.slice(0, 10) + '_' + n.slice(11, 16).replace(':', '') + '.' + ext; },
  async run(kind, btn, session) {
    setBusy(btn, true, 'กำลังเตรียมไฟล์…');
    try {
      const r = await Backend.call('export', { token: session.token });
      if (!r.success) throw new Error(r.message);
      const rows = r.data.players, names = r.data.boothNames || CONFIG.BOOTH_NAMES;
      if (kind === 'csv') this.csv(this.aoa(rows, names), this.name('csv'));
      else {
        if (!window.XLSX) await loadScript(CONFIG.SHEETJS);
        const d = await Backend.call('dashboard', { token: session.token });
        const s = d.data.summary, wb = XLSX.utils.book_new(), widths = [8, 19, 10, 19, 19, 19, 11, 19, 19, 20, 12, 14].map(w => ({ wch: w }));
        const sum = [[r.data.eventName || CONFIG.EVENT_NAME, 'Stamp Rally'], ['ข้อมูล ณ', fmtDT(r.data.generatedAt)], [], ['กลุ่ม', 'จำนวนคน', '% ของผู้เล่น']];
        s.groups.forEach(g => sum.push([g.label + ' ' + g.note, g.count, g.pct]));
        sum.push(['ผู้เล่นทั้งหมด', s.totals.players, 100], [], ['ของที่ระลึกที่แจกไป', s.totals.redeemed], ['ใช้เวลาเก็บครบ (นาที, ค่ากลาง)', s.totals.medianMinutes], ['สแกนจุดรับของตอนยังไม่ครบ (ครั้ง)', s.totals.exitFails], [], ['บูธ', 'จำนวนคน', '% ของผู้เล่น']);
        s.booths.forEach(b => sum.push([b.label, b.count, b.pct]));
        sum.push([], ['ช่วงเวลา (ทุก 15 นาที)', 'ผู้เล่นใหม่', 'รับของ']);
        s.timeline.labels.forEach((l, i) => sum.push([l, s.timeline.newPlayers[i], s.timeline.redeemedPer[i]]));
        const ws0 = XLSX.utils.aoa_to_sheet(sum); ws0['!cols'] = [{ wch: 34 }, { wch: 14 }, { wch: 14 }];
        XLSX.utils.book_append_sheet(wb, ws0, 'สรุป');
        const add = (title, list) => { const ws = XLSX.utils.aoa_to_sheet(this.aoa(list, names)); ws['!cols'] = widths; XLSX.utils.book_append_sheet(wb, ws, title); };
        this.groups.forEach(([title, st]) => add(title, rows.filter(x => x.status === st)));
        add('ทุกรหัส', rows);
        XLSX.writeFile(wb, this.name('xlsx'));
      }
      toast('ดาวน์โหลดแล้ว');
    } catch (e) { toast(String(e.message || '').indexOf('load') === 0 ? 'โหลดไลบรารี Excel ไม่ได้ ลองดาวน์โหลด CSV แทน' : (e.message || 'ดาวน์โหลดไม่สำเร็จ'), 'err'); }
    finally { setBusy(btn, false); }
  },
  csv(aoa, name) {
    const safe = v => { let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    this.download(new Blob(['﻿' + aoa.map(r => r.map(safe).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), name);
  },
  download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
};

   QR POSTERS
   ===================================================================== */
const Poster = {
  async draw({ title, sub, url, foot, foot2 }) {
    const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'), css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
    try { await Promise.all(['600 64px Prompt', '400 30px Prompt'].map(f => document.fonts.load(f))); } catch (e) { /* ใช้ฟอนต์ระบบ */ }
    g.fillStyle = v('--primary'); g.fillRect(0, 0, W, H);
    g.strokeStyle = v('--accent'); g.lineWidth = 56; g.lineCap = 'round'; g.beginPath(); g.moveTo(820, 1300); g.quadraticCurveTo(1010, 1470, 1200, 1180); g.stroke();
    const logo = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = CONFIG.LOGO; });
    if (logo) g.drawImage(logo, 90, 86, 400, 400 * logo.height / logo.width);
    g.fillStyle = '#fff'; g.font = '600 76px Prompt, sans-serif'; g.fillText(title, 90, 330);
    g.font = '400 34px Prompt, sans-serif'; g.globalAlpha = .92; g.fillText(sub, 90, 392); g.globalAlpha = 1;
    const qr = makeQR(url), n = qr.getModuleCount(), box = 560, x0 = (W - box) / 2, y0 = 500;
    g.fillStyle = '#fff'; g.beginPath(); if (g.roundRect) g.roundRect(x0 - 64, y0 - 64, box + 128, box + 128, 44); else g.rect(x0 - 64, y0 - 64, box + 128, box + 128); g.fill();
    const cell = box / n; g.fillStyle = v('--ink');
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) g.fillRect(Math.floor(x0 + col * cell), Math.floor(y0 + r * cell), Math.ceil(cell), Math.ceil(cell));
    g.fillStyle = '#fff'; g.font = '600 52px Prompt, sans-serif'; g.fillText(foot, 90, 1215);
    g.font = '400 30px Prompt, sans-serif'; g.globalAlpha = .92; g.fillText(foot2, 90, 1268); g.globalAlpha = 1;
    return c;
  },
  opts(p) {
    return p.id === 'EX'
      ? { title: 'สแกนรับของที่ระลึก', sub: 'สะสม Stamp ครบ 3 บูธแล้ว สแกนที่นี่ได้เลย', url: State.scanUrl(p.s), foot: p.name, foot2: 'ใช้แอปเดิมที่ใช้สะสม Stamp (LINE หรือกล้องมือถือ)' }
      : { title: 'สแกนสะสม Stamp', sub: 'สแกนด้วย LINE (ไม่มี LINE ใช้กล้องมือถือได้)', url: State.scanUrl(p.s), foot: p.name, foot2: 'สะสมครบ 3 บูธ รับของที่ระลึกฟรีที่ประตูทางออก' };
  }
};

      '<div class="pts">' + pts.map((p, i) => '<button type="button" class="pt' + (p.id === 'EX' ? ' exit' : '') + '" data-pt="' + i + '" aria-label="จำลองสแกน ' + esc(p.name) + '">' + qrSVG(State.scanUrl(p.s), 1) + esc(p.id === 'EX' ? 'จุดรับของ' : p.name) + '</button>').join('') + '</div>' +
      '<div class="phone"><div class="phone-screen" data-phone></div></div></div>' +
      '<div><div class="flex items-center justify-between gap-3 mb-3"><div><div class="font-semibold">Dashboard ที่แบรนด์เห็น</div><p class="panel-sub">ตัวเลขขยับทันทีเมื่อมีคนสแกน</p></div><span class="live muted"><i></i><span data-live>Live</span></span></div><div data-dash></div></div></div></main>';
    const phone = new Cust($('[data-phone]'), { embedded: true, channel: 'LINE' });
    phone.open();
    $$('[data-pt]').forEach(b => b.onclick = () => phone.scan(pts[Number(b.dataset.pt)].s));
    $('[data-newcust]').onclick = () => { phone.forget(); phone.open(); toast('เริ่มเป็นลูกค้าคนใหม่แล้ว'); };
    const d = new Dash($('[data-dash]'), { session, embedded: true });
    d.onUpdate = x => { $('[data-live]').textContent = 'Live  ' + hm(x.generatedAt) + ' น.'; };
    d.start();
    $('[data-open-dash]').onclick = () => { if (demo) location.href = location.href.split('?')[0] + '?p=dashboard'; else window.open(State.base() + '?p=dashboard', '_blank'); };
    const simBtn = $('[data-sim]');
    const setSim = on => { simBtn.classList.toggle('on', on); $('span', simBtn).textContent = on ? 'หยุดจำลอง' : 'จำลองคนเดินงาน'; };
    let gasSim = null;
    if (demo) Demo.onSimChange = setSim;
    simBtn.onclick = () => {
      if (demo) {
        if (!Demo.simulating() && Demo.ended()) return toast('งานจบแล้ว กด "เริ่มข้อมูลใหม่" เพื่อเล่นอีกรอบ', 'err');
        Demo.simulate(!Demo.simulating()); setSim(Demo.simulating());
        if (Demo.simulating()) toast('จำลองคนเดินงาน เวลาในงานเดินเร็วขึ้น 20 เท่า');
        return;
      }
      if (gasSim) { clearInterval(gasSim); gasSim = null; return setSim(false); }
      const tick = async () => { const r = await Backend.call('simulate', { token: session.token, n: 3 + Math.floor(Math.random() * 4) }); if (!r.success) { toast(r.message, 'err'); clearInterval(gasSim); gasSim = null; setSim(false); } else d.refresh(); };
      gasSim = setInterval(tick, 4000); tick(); setSim(true);
    };
    const rs = $('[data-reset]');
    if (rs) rs.onclick = () => { Demo.reset(); setSim(false); phone.forget(); phone.open(); toast('รีเซ็ตข้อมูลตัวอย่างแล้ว'); };
    if (demo) { const clk = () => { $('[data-clock-label]').textContent = 'เวลาในงานจำลอง ' + hm(Demo.clock()) + ' น.'; }; clk(); setInterval(clk, 1000); }
  }
};

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  if (Backend.mode === 'demo') { const b = $('#demo-bar'); b.hidden = false; b.textContent = 'โหมดตัวอย่าง: ข้อมูลจำลองในเบราว์เซอร์นี้ ยังไม่ได้เชื่อม Google Sheet'; }
  const params = await Backend.params();
  const p = String(params.p || '').toLowerCase();
  if (params.s) return Views.customer(params);
  if (p === 'dashboard' || p === 'admin') return Views.dashboard(params);
  if (p === 'showcase' || p === 'demo' || (!p && Backend.mode === 'demo')) return Views.showcase();
  return Views.customer(params);
})();
</script>
</body>
</html>
